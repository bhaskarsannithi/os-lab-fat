<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OS Lab FAT — Code Only</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121c2e;--line:#26354d;--text:#e8eef8;--muted:#a8b7cc;--accent:#60a5fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui, sans-serif}
main{max-width:1050px;margin:auto;padding:22px}
header{padding:18px 0 12px}h1{font-size:clamp(1.5rem,4vw,2.2rem);margin:0 0 6px}p{color:var(--muted);margin:0}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}
button{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 13px;border-radius:9px;cursor:pointer;font:inherit}
button.active,button:hover{border-color:var(--accent);background:#17304e}
section{display:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
section.active{display:block}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h2{font-size:1.1rem;margin:0}pre{margin:0;padding:16px;overflow:auto;white-space:pre;line-height:1.5;font:14px ui-monospace,SFMono-Regular,Consolas,monospace;color:#d7e7ff}
.copy{background:#1d4ed8;border-color:#2563eb}.subnav{display:flex;flex-wrap:wrap;gap:7px;padding:12px 14px;border-bottom:1px solid var(--line)}
.subnav button{font-size:.9rem;padding:7px 10px}.note{font-size:.88rem;color:var(--muted);margin:14px 0 0}
</style>
</head>
<body>
<main>
<header><h1>OS Lab FAT — Code Only</h1><p>Choose an experiment, then use Copy Code. No theory or aim sections.</p></header>
<nav id="tabs"></nav>
<div id="content"></div>
<p class="note">For C programs: save the copied code as a .c file, compile with GCC, then run the executable. Experiment 1 contains terminal commands; Experiment 2 contains shell scripts.</p>
</main>
<script>
const experiments = [
{title:"Experiment 1 — Basic Linux Commands", parts:[
["Commands",`# File and directory commands
pwd
ls
ls -a
mkdir test
cd test
touch file.txt
echo "Hello Linux" > file.txt
cat file.txt
cp file.txt copy.txt
mv copy.txt renamed.txt
file renamed.txt
head -n 5 renamed.txt
tail -n 5 renamed.txt
find . -name "*.txt"
rm renamed.txt
cd ..
rmdir test

# System information
whoami
who
tty
uname -a
date
df -h
free -h
history
clear`]]},
{title:"Experiment 2 — Basic Shell Programs",parts:[
["Addition",`#!/bin/bash
echo "Enter two numbers:"
read a b
echo "Sum = $((a + b))"`],
["Largest of two",`#!/bin/bash
echo "Enter two numbers:"
read a b
if [ "$a" -gt "$b" ]; then
    echo "$a is larger"
elif [ "$b" -gt "$a" ]; then
    echo "$b is larger"
else
    echo "Both are equal"
fi`],
["Sum of digits",`#!/bin/bash
echo "Enter a number:"
read n
sum=0
while [ "$n" -gt 0 ]; do
    sum=$((sum + n % 10))
    n=$((n / 10))
done
echo "Sum of digits = $sum"`],
["Fibonacci",`#!/bin/bash
echo "Enter number of terms:"
read n
a=0
b=1
for ((i=0; i<n; i++)); do
    echo -n "$a "
    c=$((a + b))
    a=$b
    b=$c
done
echo`],
["Factorial",`#!/bin/bash
echo "Enter a number:"
read n
fact=1
while [ "$n" -gt 1 ]; do
    fact=$((fact * n))
    n=$((n - 1))
done
echo "Factorial = $fact"`]]},
{title:"Experiment 3 — System Calls",parts:[
["fork()",`#include <stdio.h>
#include <unistd.h>
#include <sys/wait.h>

int main(void) {
    pid_t pid = fork();
    if (pid < 0) {
        perror("fork");
        return 1;
    }
    if (pid == 0)
        printf("Child: pid=%d, parent=%d\\n", getpid(), getppid());
    else {
        printf("Parent: pid=%d\\n", getpid());
        wait(NULL);
    }
    return 0;
}`],
["stat()",`#include <stdio.h>
#include <sys/stat.h>

int main(void) {
    struct stat s;
    char path[256];
    printf("Enter file name: ");
    scanf("%255s", path);
    if (stat(path, &s) == -1) {
        perror("stat");
        return 1;
    }
    printf("Size: %ld bytes\\n", (long)s.st_size);
    printf("Inode: %ld\\n", (long)s.st_ino);
    printf("Regular file: %s\\n", S_ISREG(s.st_mode) ? "Yes" : "No");
    return 0;
}`],
["exit(), wait(), exec()",`#include <stdio.h>
#include <unistd.h>
#include <sys/wait.h>
#include <stdlib.h>

int main(void) {
    pid_t pid = fork();
    if (pid == 0) {
        execlp("date", "date", NULL);
        perror("execlp");
        exit(1);
    } else if (pid > 0) {
        wait(NULL);
        printf("Child completed\\n");
    } else {
        perror("fork");
    }
    return 0;
}`],
["opendir(), readdir()",`#include <stdio.h>
#include <dirent.h>

int main(int argc, char *argv[]) {
    const char *path = argc > 1 ? argv[1] : ".";
    DIR *dir = opendir(path);
    if (!dir) {
        perror("opendir");
        return 1;
    }
    struct dirent *entry;
    while ((entry = readdir(dir)) != NULL)
        printf("%s\\n", entry->d_name);
    closedir(dir);
    return 0;
}`],
["open(), read(), write()",`#include <stdio.h>
#include <unistd.h>
#include <fcntl.h>

int main(int argc, char *argv[]) {
    if (argc < 2) {
        printf("Usage: %s filename\\n", argv[0]);
        return 1;
    }
    int fd = open(argv[1], O_RDONLY);
    if (fd < 0) {
        perror("open");
        return 1;
    }
    char buf[1];
    off_t end = lseek(fd, 0, SEEK_END);
    while (end > 0) {
        end--;
        lseek(fd, end, SEEK_SET);
        if (read(fd, buf, 1) == 1)
            write(STDOUT_FILENO, buf, 1);
    }
    close(fd);
    return 0;
}`]]},
{title:"Experiment 4 — FCFS Scheduling",parts:[
["FCFS",`#include <stdio.h>

int main(void) {
    int n, bt[20], wt[20], tat[20];
    float avgwt = 0, avgtat = 0;
    printf("Enter number of processes: ");
    scanf("%d", &n);
    for (int i = 0; i < n; i++) {
        printf("Burst time P%d: ", i + 1);
        scanf("%d", &bt[i]);
    }
    wt[0] = 0;
    for (int i = 1; i < n; i++)
        wt[i] = wt[i - 1] + bt[i - 1];
    for (int i = 0; i < n; i++) {
        tat[i] = wt[i] + bt[i];
        avgwt += wt[i];
        avgtat += tat[i];
        printf("P%d\\tBT=%d\\tWT=%d\\tTAT=%d\\n",
               i + 1, bt[i], wt[i], tat[i]);
    }
    printf("Average WT = %.2f\\n", avgwt / n);
    printf("Average TAT = %.2f\\n", avgtat / n);
    return 0;
}`]]},
{title:"Experiment 5 — Pthreads",parts:[
["Thread sum",`#include <stdio.h>
#include <stdlib.h>
#include <pthread.h>

void *sum(void *arg) {
    long n = *(long *)arg;
    long *result = malloc(sizeof(long));
    *result = n * (n + 1) / 2;
    return result;
}
int main(int argc, char *argv[]) {
    if (argc != 2) {
        printf("Usage: %s <integer>\\n", argv[0]);
        return 1;
    }
    long n = atol(argv[1]);
    pthread_t tid;
    pthread_create(&tid, NULL, sum, &n);
    long *ans;
    pthread_join(tid, (void **)&ans);
    printf("Sum = %ld\\n", *ans);
    free(ans);
    return 0;
}`]]},
{title:"Experiment 6 — Semaphore Producer/Consumer",parts:[
["Producer-consumer",`#include <stdio.h>
#include <pthread.h>
#include <semaphore.h>

#define SIZE 5
int buffer[SIZE], in = 0, out = 0;
sem_t empty, full;
pthread_mutex_t mutex;

void *producer(void *arg) {
    for (int i = 1; i <= 5; i++) {
        sem_wait(&empty);
        pthread_mutex_lock(&mutex);
        buffer[in] = i;
        printf("Produced: %d\\n", i);
        in = (in + 1) % SIZE;
        pthread_mutex_unlock(&mutex);
        sem_post(&full);
    }
    return NULL;
}
void *consumer(void *arg) {
    for (int i = 1; i <= 5; i++) {
        sem_wait(&full);
        pthread_mutex_lock(&mutex);
        int item = buffer[out];
        printf("Consumed: %d\\n", item);
        out = (out + 1) % SIZE;
        pthread_mutex_unlock(&mutex);
        sem_post(&empty);
    }
    return NULL;
}
int main(void) {
    pthread_t p, c;
    sem_init(&empty, 0, SIZE);
    sem_init(&full, 0, 0);
    pthread_mutex_init(&mutex, NULL);
    pthread_create(&p, NULL, producer, NULL);
    pthread_create(&c, NULL, consumer, NULL);
    pthread_join(p, NULL);
    pthread_join(c, NULL);
    sem_destroy(&empty);
    sem_destroy(&full);
    pthread_mutex_destroy(&mutex);
    return 0;
}`]]},
{title:"Experiment 7 — Banker's Algorithm",parts:[
["Banker's safety check",`#include <stdio.h>

int main(void) {
    int n, m, alloc[10][10], max[10][10], need[10][10];
    int avail[10], finish[10] = {0}, safe[10], count = 0;
    printf("Processes and resources: ");
    scanf("%d%d", &n, &m);
    printf("Enter allocation matrix:\\n");
    for (int i = 0; i < n; i++)
        for (int j = 0; j < m; j++) scanf("%d", &alloc[i][j]);
    printf("Enter maximum matrix:\\n");
    for (int i = 0; i < n; i++)
        for (int j = 0; j < m; j++) scanf("%d", &max[i][j]);
    printf("Enter available resources:\\n");
    for (int j = 0; j < m; j++) scanf("%d", &avail[j]);
    for (int i = 0; i < n; i++)
        for (int j = 0; j < m; j++) need[i][j] = max[i][j] - alloc[i][j];

    while (count < n) {
        int found = 0;
        for (int i = 0; i < n; i++) if (!finish[i]) {
            int possible = 1;
            for (int j = 0; j < m; j++)
                if (need[i][j] > avail[j]) possible = 0;
            if (possible) {
                for (int j = 0; j < m; j++) avail[j] += alloc[i][j];
                safe[count++] = i;
                finish[i] = 1;
                found = 1;
            }
        }
        if (!found) break;
    }
    if (count == n) {
        printf("Safe sequence: ");
        for (int i = 0; i < n; i++) printf("P%d ", safe[i]);
        printf("\\n");
    } else printf("Unsafe state\\n");
    return 0;
}`]]},
{title:"Experiment 8 — Paging",parts:[
["Frame allocation",`#include <stdio.h>

int main(void) {
    int total, frame, os, jobs, size[20], frames[20], used = 0;
    printf("Total memory size: ");
    scanf("%d", &total);
    printf("Frame size: ");
    scanf("%d", &frame);
    if (frame <= 0 || total < frame) {
        printf("Invalid frame size\\n");
        return 1;
    }
    int totalFrames = total / frame;
    printf("OS memory size: ");
    scanf("%d", &os);
    int osFrames = (os + frame - 1) / frame;
    if (osFrames > totalFrames) {
        printf("OS exceeds memory\\n");
        return 1;
    }
    used = osFrames;
    printf("Number of jobs: ");
    scanf("%d", &jobs);
    for (int i = 0; i < jobs; i++) {
        printf("Job %d size: ", i + 1);
        scanf("%d", &size[i]);
        frames[i] = (size[i] + frame - 1) / frame;
        if (used + frames[i] <= totalFrames) {
            printf("Job %d allocated %d frame(s)\\n", i + 1, frames[i]);
            used += frames[i];
        } else printf("Job %d cannot be allocated\\n", i + 1);
    }
    printf("Free frames = %d\\n", totalFrames - used);
    return 0;
}`]]},
{title:"Experiment 9 — Segmentation",parts:[
["Address translation",`#include <stdio.h>

int main(void) {
    int n, base[10], limit[10], seg, offset;
    printf("Number of segments: ");
    scanf("%d", &n);
    for (int i = 0; i < n; i++) {
        printf("Base and limit for segment %d: ", i);
        scanf("%d%d", &base[i], &limit[i]);
    }
    printf("Enter segment number and offset: ");
    scanf("%d%d", &seg, &offset);
    if (seg < 0 || seg >= n) {
        printf("Invalid segment\\n");
    } else if (offset < 0 || offset >= limit[seg]) {
        printf("Invalid offset / segmentation fault\\n");
    } else {
        printf("Physical address = %d\\n", base[seg] + offset);
    }
    return 0;
}`]]},
{title:"Experiment 10 — FIFO Page Replacement",parts:[
["FIFO",`#include <stdio.h>

int main(void) {
    int n, f, pages[100], frame[15], faults = 0, next = 0;
    printf("Number of frames: ");
    scanf("%d", &f);
    printf("Number of pages: ");
    scanf("%d", &n);
    for (int i = 0; i < n; i++) {
        printf("Page %d: ", i + 1);
        scanf("%d", &pages[i]);
    }
    for (int i = 0; i < f; i++) frame[i] = -1;
    for (int i = 0; i < n; i++) {
        int hit = 0;
        for (int j = 0; j < f; j++)
            if (frame[j] == pages[i]) hit = 1;
        if (!hit) {
            frame[next] = pages[i];
            next = (next + 1) % f;
            faults++;
        }
        printf("%d: ", pages[i]);
        for (int j = 0; j < f; j++)
            if (frame[j] == -1) printf("- ");
            else printf("%d ", frame[j]);
        printf("%s\\n", hit ? "Hit" : "Fault");
    }
    printf("Total page faults = %d\\n", faults);
    return 0;
}`]]}
];

const tabs = document.getElementById('tabs');
const content = document.getElementById('content');
experiments.forEach((exp, i) => {
  const tab = document.createElement('button');
  tab.textContent = `Exp ${i+1}`;
  tab.className = i === 0 ? 'active' : '';
  tab.onclick = () => show(i);
  tabs.appendChild(tab);

  const section = document.createElement('section');
  section.id = `exp-${i}`;
  if (i === 0) section.className = 'active';
  const head = document.createElement('div');
  head.className = 'sectionhead';
  const title = document.createElement('h2');
  title.textContent = exp.title;
  const copyAll = document.createElement('button');
  copyAll.className = 'copy';
  copyAll.textContent = 'Copy selected code';
  head.append(title, copyAll);
  section.appendChild(head);

  const subnav = document.createElement('div');
  subnav.className = 'subnav';
  const codeEls = [];
  exp.parts.forEach((part, j) => {
    const sub = document.createElement('button');
    sub.textContent = part[0];
    if (j === 0) sub.className = 'active';
    sub.onclick = () => {
      subnav.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      sub.classList.add('active');
      codeEls.forEach((pre,k)=>pre.style.display = k === j ? 'block' : 'none');
      copyAll.onclick = () => copyText(part[1], copyAll);
    };
    subnav.appendChild(sub);
    const pre = document.createElement('pre');
    pre.textContent = part[1];
    pre.style.display = j === 0 ? 'block' : 'none';
    codeEls.push(pre);
    section.appendChild(pre);
  });
  section.insertBefore(subnav, section.children[1]);
  copyAll.onclick = () => copyText(exp.parts[0][1], copyAll);
  content.appendChild(section);
});
function copyText(text, button){
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(()=>button.textContent='Copied!').catch(()=>fallbackCopy(text, button));
  } else fallbackCopy(text, button);
}
function fallbackCopy(text, button){
  const area=document.createElement('textarea'); area.value=text; area.style.position='fixed'; area.style.opacity='0';
  document.body.appendChild(area); area.select();
  try { document.execCommand('copy'); button.textContent='Copied!'; } catch(e) { button.textContent='Select code and copy'; }
  area.remove();
}
function show(i){
  [...tabs.children].forEach((b,k)=>b.classList.toggle('active',k===i));
  [...content.children].forEach((s,k)=>s.classList.toggle('active',k===i));
}
</script>
</body>
